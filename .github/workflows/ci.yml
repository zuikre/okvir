name: Okvir Continuous Integration & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Sources
        run: npm run typecheck

      - name: Lint Codebase & React Rules
        run: npm run lint

      - name: Test Curriculum DSL & AST Validation
        run: npm test

      - name: Build Production Assets
        run: npm run build
